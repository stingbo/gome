syntax = "proto3";
option go_package = "github.com/stingbo/gome/api;api";

enum TransactionType {
  BUY = 0;
  SELL = 1;
}

//定义请求结构
message OrderRequest {
  string uuid = 1; // 用户唯一标识
  string oid = 2; // 订单唯一标识
  string symbol = 3; // 交易对
  TransactionType transaction = 4; // 交易方向，buy/sale
  double price = 5; // 交易价格
  double volume = 6; // 交易数量
}

//定义响应结构
message OrderResponse {
  int32 code = 1;
  string message = 2;
  bool duplicate = 3; // Same normalized DoOrder request was submitted before.
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1; // Publication has not been confirmed.
  ORDER_STATUS_QUEUED = 2;
  ORDER_STATUS_OPEN = 3;
  ORDER_STATUS_PARTIALLY_FILLED = 4;
  ORDER_STATUS_FILLED = 5;
  ORDER_STATUS_CANCELLED = 6;
}

message OrderStatusRequest {
  string uuid = 1;
  string oid = 2;
  string symbol = 3;
}

message OrderStatusResponse {
  OrderStatus status = 1;
  TransactionType transaction = 2;
  int64 price_ticks = 3;
  int64 original_volume_ticks = 4;
  int64 filled_volume_ticks = 5;
  int64 remaining_volume_ticks = 6;
  int64 cancelled_volume_ticks = 7;
  int32 accuracy = 8;
}

//定义下单服务
service Order {
  rpc DoOrder(OrderRequest) returns (OrderResponse){}
  rpc DeleteOrder(OrderRequest) returns (OrderResponse){}
  rpc GetOrderStatus(OrderStatusRequest) returns (OrderStatusResponse){}
}
